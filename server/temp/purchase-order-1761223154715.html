<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Purchase Order</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
        }
        .container {
            width: 8.5in;
            min-height: 11in;
            margin: auto;
            padding: 60px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container" style="font-family: Arial, sans-serif; width: 100%; max-width: 800px; margin: 40px auto; padding: 20px;">
        <h1 style="font-size: 22px; font-weight: bold; margin-bottom: 10px; padding-left: 5px;">PURCHASE ORDER</h1>
        <p style="font-size: 14px; margin-top: 0; margin-bottom: 20px; padding-left: 5px;">
            <span style="font-weight: bold;">Buyer:</span> 
            &nbsp;&nbsp;&nbsp;
            <span style="font-weight: bold;">PO No:</span> 
            &nbsp;&mdash;&nbsp;
            <span style="font-weight: bold;">Order ID:</span> 
        </p>

        <table style="width: 100%; border-collapse: collapse; border: 1px solid black;">
            <tbody>
                <tr style="border-bottom: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px; width: 25%;">Product</td>
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">hoodie, knit</td>
                </tr>
                <tr style="border-bottom: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">HS Code</td>
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">6102.20.00</td>
                </tr>
                <tr style="border-bottom: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">Qty</td>
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">44849 pcs</td>
                </tr>
                <tr style="border-bottom: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">FOB USD/pc</td>
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">10.74</td>
                </tr>
                <tr style="border-bottom: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">Ex-Factory Date</td>
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;"></td>
                </tr>
                <tr style="border-bottom: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">Port of Loading</td>
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">Benapole Land Port</td>
                </tr>
                <tr style="border-bottom: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">Destination</td>
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">US</td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">Incoterm</td>
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
