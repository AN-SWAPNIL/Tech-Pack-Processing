<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Packing List</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; font-size: 12pt; color: #000000;">
    <div style="width: 100%; max-width: 800px; padding: 40px;">
        
        <div style="font-size: 22pt; font-weight: bold; margin-bottom: 25px;">PACKING LIST</div>

        <div style="margin-bottom: 10px; font-size: 12pt;">
            <div style="margin-bottom: 5px;">
                <span style="font-weight: bold;">Buyer:</span> 
            </div>
            <div style="padding-bottom: 5px; border-bottom: 1px solid black;">
                <span style="font-weight: bold;">PO No:</span> &nbsp;&mdash;&nbsp; <span style="font-weight: bold;">Order ID:</span> 
            </div>
        </div>

        <table style="width: 100%; border-collapse: collapse; border: 1px solid black; font-size: 12pt;">
            <tbody>
                <tr>
                    <td style="border: 1px solid black; padding: 6px; width: 35%;">Total Cartons</td>
                    <td style="border: 1px solid black; padding: 6px;"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 6px;">Total Quantity (pcs)</td>
                    <td style="border: 1px solid black; padding: 6px;">44849</td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 6px;">Gross Weight (MT)</td>
                    <td style="border: 1px solid black; padding: 6px;"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 6px;">Net Weight (MT)</td>
                    <td style="border: 1px solid black; padding: 6px;"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 6px;">Ex-Factory Date</td>
                    <td style="border: 1px solid black; padding: 6px;"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 6px;">Destination Port</td>
                    <td style="border: 1px solid black; padding: 6px;">Benapole Land Port</td>
                </tr>
            </tbody>
        </table>

    </div>
</body>
</html>
