<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliance Certificate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
        }
        .container {
            width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container" style="width: 800px; margin: 40px auto; padding: 20px; font-family: Arial, sans-serif;">
        <div style="font-size: 24px; font-weight: bold; margin-bottom: 40px;">
            COMPLIANCE CERTIFICATE
        </div>
        <div style="margin-bottom: 20px; font-size: 16px;">
            <span style="font-weight: bold;">Factory:</span> Factory 1 Ltd. (Narayanganj)
        </div>
        <table style="width: 100%; border-collapse: collapse; border: 1px solid black;">
            <thead>
                <tr style="background-color: #E0E0E0;">
                    <th style="border: 1px solid black; padding: 10px; text-align: left; font-weight: normal; width: 50%;">Certification</th>
                    <th style="border: 1px solid black; padding: 10px; text-align: left; font-weight: normal; width: 50%;">Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td style="border: 1px solid black; padding: 10px;">OEKO-TEX</td>
                    <td style="border: 1px solid black; padding: 10px;">Expired</td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 10px;">RCS</td>
                    <td style="border: 1px solid black; padding: 10px;">Valid</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
