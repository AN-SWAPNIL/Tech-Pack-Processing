<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Purchase Order</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #000000;
        }
        .container {
            width: 800px;
            margin: 0 auto;
            padding: 40px;
        }
        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .details {
            margin-bottom: 20px;
            font-size: 14px;
        }
        .details-line {
            margin-bottom: 4px;
        }
        .label {
            font-weight: bold;
        }
        .po-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid black;
            font-size: 14px;
        }
        .po-table th, .po-table td {
            border: 1px solid #808080;
            padding: 8px;
            text-align: left;
        }
        .po-table td:first-child {
            width: 30%;
        }
    </style>
</head>
<body>
    <div class="container" style="width: 800px; margin: 0 auto; padding: 40px; font-family: Arial, sans-serif;">
        <div class="header" style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">
            PURCHASE ORDER
        </div>
        <div class="details" style="margin-bottom: 20px; font-size: 14px;">
            <div class="details-line" style="margin-bottom: 4px;"><span class="label" style="font-weight: bold;">Buyer:</span> </div>
            <div class="details-line" style="margin-bottom: 4px;"><span class="label" style="font-weight: bold;">PO No:</span> &mdash; <span class="label" style="font-weight: bold;">Order ID:</span> unknown</div>
        </div>
        <table class="po-table" style="width: 100%; border-collapse: collapse; border: 1px solid black; font-size: 14px;">
            <tbody>
                <tr>
                    <td style="border: 1px solid #808080; padding: 8px; width: 30%;">Product</td>
                    <td style="border: 1px solid #808080; padding: 8px;">hoodie, knit</td>
                </tr>
                <tr>
                    <td style="border: 1px solid #808080; padding: 8px;">HS Code</td>
                    <td style="border: 1px solid #808080; padding: 8px;">6102.20.00</td>
                </tr>
                <tr>
                    <td style="border: 1px solid #808080; padding: 8px;">Qty</td>
                    <td style="border: 1px solid #808080; padding: 8px;">44849 pcs</td>
                </tr>
                <tr>
                    <td style="border: 1px solid #808080; padding: 8px;">FOB USD/pc</td>
                    <td style="border: 1px solid #808080; padding: 8px;">10.74</td>
                </tr>
                <tr>
                    <td style="border: 1px solid #808080; padding: 8px;">Ex-Factory Date</td>
                    <td style="border: 1px solid #808080; padding: 8px;"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid #808080; padding: 8px;">Port of Loading</td>
                    <td style="border: 1px solid #808080; padding: 8px;">Benapole Land Port</td>
                </tr>
                <tr>
                    <td style="border: 1px solid #808080; padding: 8px;">Destination</td>
                    <td style="border: 1px solid #808080; padding: 8px;">US</td>
                </tr>
                <tr>
                    <td style="border: 1px solid #808080; padding: 8px;">Incoterm</td>
                    <td style="border: 1px solid #808080; padding: 8px;"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
