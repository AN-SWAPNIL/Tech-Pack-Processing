<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliance Certificate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
            margin: 40px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        h1 {
            font-size: 18px;
            font-weight: bold;
            text-align: left;
            margin-bottom: 30px;
        }
        .factory-info {
            margin-bottom: 15px;
            font-size: 14px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid black;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #E0E0E0;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="container" style="font-family: Arial, sans-serif; font-size: 12px; margin: 40px; max-width: 800px;">
        <h1 style="font-size: 20px; font-weight: bold; text-align: left; margin-bottom: 30px; margin-top: 0;">COMPLIANCE CERTIFICATE</h1>
        <div class="factory-info" style="margin-bottom: 15px; font-size: 14px;">
            <strong style="font-weight: bold;">Factory:</strong> Factory 1 Ltd. (Narayanganj)
        </div>
        <table style="width: 100%; border-collapse: collapse; border: 1px solid black;">
            <thead>
                <tr>
                    <th style="border: 1px solid black; padding: 8px; text-align: left; font-size: 14px; background-color: #E0E0E0; font-weight: bold;">Certification</th>
                    <th style="border: 1px solid black; padding: 8px; text-align: left; font-size: 14px; background-color: #E0E0E0; font-weight: bold;">Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td style="border: 1px solid black; padding: 8px; text-align: left; font-size: 14px;">OEKO-TEX</td>
                    <td style="border: 1px solid black; padding: 8px; text-align: left; font-size: 14px;">Expired</td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 8px; text-align: left; font-size: 14px;">RCS</td>
                    <td style="border: 1px solid black; padding: 8px; text-align: left; font-size: 14px;">Valid</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
