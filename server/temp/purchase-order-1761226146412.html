<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Purchase Order</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
        }
        .container {
            width: 800px;
            margin: 0 auto;
            padding: 40px;
        }
        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .order-info {
            margin-bottom: 20px;
            font-size: 14px;
        }
        .order-info p {
            margin: 0;
            line-height: 1.5;
        }
        .details-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid black;
        }
        .details-table td {
            border: 1px solid black;
            padding: 8px;
            font-size: 14px;
        }
        .label-column {
            width: 25%;
        }
    </style>
</head>
<body>
    <div class="container" style="width: 800px; margin: 0 auto; padding: 40px; font-family: Arial, sans-serif;">
        <div class="header" style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">
            PURCHASE ORDER
        </div>
        <div class="order-info" style="margin-bottom: 20px; font-size: 14px;">
            <p style="margin: 0; line-height: 1.5;"><b>Buyer:</b> </p>
            <p style="margin: 0; line-height: 1.5;"><b>PO No:</b> &mdash; <b>Order ID:</b> unknown</p>
        </div>
        <table class="details-table" style="width: 100%; border-collapse: collapse; border: 1px solid black;">
            <tbody>
                <tr>
                    <td class="label-column" style="border: 1px solid black; padding: 8px; font-size: 14px; width: 25%;">Product</td>
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">hoodie, knit</td>
                </tr>
                <tr>
                    <td class="label-column" style="border: 1px solid black; padding: 8px; font-size: 14px; width: 25%;">HS Code</td>
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">6102.20.00</td>
                </tr>
                <tr>
                    <td class="label-column" style="border: 1px solid black; padding: 8px; font-size: 14px; width: 25%;">Qty</td>
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">44849 pcs</td>
                </tr>
                <tr>
                    <td class="label-column" style="border: 1px solid black; padding: 8px; font-size: 14px; width: 25%;">FOB USD/pc</td>
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">10.74</td>
                </tr>
                <tr>
                    <td class="label-column" style="border: 1px solid black; padding: 8px; font-size: 14px; width: 25%;">Ex-Factory Date</td>
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;"></td>
                </tr>
                <tr>
                    <td class="label-column" style="border: 1px solid black; padding: 8px; font-size: 14px; width: 25%;">Port of Loading</td>
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">Benapole Land Port</td>
                </tr>
                <tr>
                    <td class="label-column" style="border: 1px solid black; padding: 8px; font-size: 14px; width: 25%;">Destination</td>
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;">US</td>
                </tr>
                <tr>
                    <td class="label-column" style="border: 1px solid black; padding: 8px; font-size: 14px; width: 25%;">Incoterm</td>
                    <td style="border: 1px solid black; padding: 8px; font-size: 14px;"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
