<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Purchase Order</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #000000;
        }
        .container {
            width: 800px;
            margin: 0 auto;
            padding: 40px;
        }
        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .sub-header {
            margin-bottom: 20px;
            font-size: 12px;
        }
        .po-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid black;
        }
        .po-table td {
            border-left: 1px solid black;
            border-right: 1px solid black;
            border-bottom: 1px solid #cccccc;
            padding: 6px 8px;
            vertical-align: top;
        }
        .po-table tr:last-child td {
            border-bottom: none;
        }
        .label-col {
            width: 150px;
        }
    </style>
</head>
<body>
    <div class="container" style="width: 800px; margin: 0 auto; padding: 40px; font-family: Arial, sans-serif;">
        <div class="header" style="font-size: 24px; font-weight: bold; margin-bottom: 10px; padding-top: 20px;">
            PURCHASE ORDER
        </div>
        <div class="sub-header" style="margin-bottom: 20px; font-size: 12px; line-height: 1.5;">
            <div style="margin-bottom: 5px;"><b>Buyer:</b> </div>
            <div><b>PO No:</b> &mdash; <b>Order ID:</b> unknown</div>
        </div>
        <table class="po-table" style="width: 100%; border-collapse: collapse; border: 1px solid black;">
            <tbody>
                <tr>
                    <td class="label-col" style="border-left: 1px solid black; border-right: 1px solid black; border-bottom: 1px solid #cccccc; padding: 6px 8px; vertical-align: top; width: 150px;">Product</td>
                    <td style="border-left: 1px solid black; border-right: 1px solid black; border-bottom: 1px solid #cccccc; padding: 6px 8px; vertical-align: top;">hoodie, knit</td>
                </tr>
                <tr>
                    <td class="label-col" style="border-left: 1px solid black; border-right: 1px solid black; border-bottom: 1px solid #cccccc; padding: 6px 8px; vertical-align: top; width: 150px;">HS Code</td>
                    <td style="border-left: 1px solid black; border-right: 1px solid black; border-bottom: 1px solid #cccccc; padding: 6px 8px; vertical-align: top;">6102.20.00</td>
                </tr>
                <tr>
                    <td class="label-col" style="border-left: 1px solid black; border-right: 1px solid black; border-bottom: 1px solid #cccccc; padding: 6px 8px; vertical-align: top; width: 150px;">Qty</td>
                    <td style="border-left: 1px solid black; border-right: 1px solid black; border-bottom: 1px solid #cccccc; padding: 6px 8px; vertical-align: top;">44849 pcs</td>
                </tr>
                <tr>
                    <td class="label-col" style="border-left: 1px solid black; border-right: 1px solid black; border-bottom: 1px solid #cccccc; padding: 6px 8px; vertical-align: top; width: 150px;">FOB USD/pc</td>
                    <td style="border-left: 1px solid black; border-right: 1px solid black; border-bottom: 1px solid #cccccc; padding: 6px 8px; vertical-align: top;">10.74</td>
                </tr>
                <tr>
                    <td class="label-col" style="border-left: 1px solid black; border-right: 1px solid black; border-bottom: 1px solid #cccccc; padding: 6px 8px; vertical-align: top; width: 150px;">Ex-Factory Date</td>
                    <td style="border-left: 1px solid black; border-right: 1px solid black; border-bottom: 1px solid #cccccc; padding: 6px 8px; vertical-align: top;"></td>
                </tr>
                <tr>
                    <td class="label-col" style="border-left: 1px solid black; border-right: 1px solid black; border-bottom: 1px solid #cccccc; padding: 6px 8px; vertical-align: top; width: 150px;">Port of Loading</td>
                    <td style="border-left: 1px solid black; border-right: 1px solid black; border-bottom: 1px solid #cccccc; padding: 6px 8px; vertical-align: top;">Benapole Land Port</td>
                </tr>
                <tr>
                    <td class="label-col" style="border-left: 1px solid black; border-right: 1px solid black; border-bottom: 1px solid #cccccc; padding: 6px 8px; vertical-align: top; width: 150px;">Destination</td>
                    <td style="border-left: 1px solid black; border-right: 1px solid black; border-bottom: 1px solid #cccccc; padding: 6px 8px; vertical-align: top;">US</td>
                </tr>
                <tr>
                    <td class="label-col" style="border-left: 1px solid black; border-right: 1px solid black; border-bottom: none; padding: 6px 8px; vertical-align: top; width: 150px;">Incoterm</td>
                    <td style="border-left: 1px solid black; border-right: 1px solid black; border-bottom: none; padding: 6px 8px; vertical-align: top;"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
