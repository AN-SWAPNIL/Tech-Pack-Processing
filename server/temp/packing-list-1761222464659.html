<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Packing List</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 40px; font-size: 14px;">

    <div style="padding: 20px;">
        <div style="font-size: 24px; font-weight: bold; margin-bottom: 25px;">
            PACKING LIST
        </div>

        <div style="margin-bottom: 15px; line-height: 1.6;">
            <span style="font-weight: bold;">Buyer:</span><br>
            <span style="font-weight: bold;">PO No:</span> &mdash; <span style="font-weight: bold;">Order ID:</span> unknown
        </div>

        <table style="width: 100%; max-width: 650px; border-collapse: collapse; border: 1px solid black;">
            <tbody>
                <tr>
                    <td style="border: 1px solid black; padding: 8px; width: 40%;">Total Cartons</td>
                    <td style="border: 1px solid black; padding: 8px;"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 8px;">Total Quantity (pcs)</td>
                    <td style="border: 1px solid black; padding: 8px;">44849</td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 8px;">Gross Weight (MT)</td>
                    <td style="border: 1px solid black; padding: 8px;"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 8px;">Net Weight (MT)</td>
                    <td style="border: 1px solid black; padding: 8px;"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 8px;">Ex-Factory Date</td>
                    <td style="border: 1px solid black; padding: 8px;"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 8px;">Destination Port</td>
                    <td style="border: 1px solid black; padding: 8px;">Benapole Land Port</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
