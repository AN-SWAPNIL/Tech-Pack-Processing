<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliance Certificate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12pt;
            margin: 40px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            margin: auto;
        }
        h1 {
            font-size: 16pt;
            font-weight: bold;
            text-align: left;
            margin-bottom: 30px;
        }
        .factory-info {
            margin-bottom: 15px;
            font-size: 12pt;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid black;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
            font-size: 12pt;
        }
        th {
            background-color: #E0E0E0;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-family: Arial, sans-serif; font-size: 16pt; font-weight: bold; text-align: left; margin-bottom: 30px;">COMPLIANCE CERTIFICATE</h1>
        <div class="factory-info" style="font-family: Arial, sans-serif; font-size: 12pt; margin-bottom: 15px;">
            <span style="font-weight: bold;">Factory:</span> Factory 1 Ltd. (Narayanganj)
        </div>
        <table style="width: 100%; border-collapse: collapse; border: 1px solid black;">
            <thead>
                <tr>
                    <th style="border: 1px solid black; padding: 8px; text-align: left; background-color: #E0E0E0; font-weight: normal; font-family: Arial, sans-serif; font-size: 12pt;">Certification</th>
                    <th style="border: 1px solid black; padding: 8px; text-align: left; background-color: #E0E0E0; font-weight: normal; font-family: Arial, sans-serif; font-size: 12pt;">Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td style="border: 1px solid black; padding: 8px; text-align: left; font-family: Arial, sans-serif; font-size: 12pt;">OEKO-TEX</td>
                    <td style="border: 1px solid black; padding: 8px; text-align: left; font-family: Arial, sans-serif; font-size: 12pt;">Expired</td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 8px; text-align: left; font-family: Arial, sans-serif; font-size: 12pt;">RCS</td>
                    <td style="border: 1px solid black; padding: 8px; text-align: left; font-family: Arial, sans-serif; font-size: 12pt;">Valid</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
