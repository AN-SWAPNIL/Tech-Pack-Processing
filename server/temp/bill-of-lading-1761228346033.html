<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bill of Lading</title>
</head>
<body style="font-family: Arial, sans-serif; font-size: 14px; color: #000000;">
    <div style="width: 100%; max-width: 800px; margin: 0 auto; padding: 20px;">
        <div style="font-size: 24px; font-weight: bold; margin-bottom: 15px;">BILL OF LADING (B/L)</div>
        <div style="margin-bottom: 2px;">
            <span style="font-weight: bold;">Order ID:</span> unknown — <span style="font-weight: bold;">PO:</span> 
        </div>
        <div style="margin-bottom: 15px;">
            Port of Loading: Benapole Land Port | Destination: US
        </div>
        <table style="width: 100%; border-collapse: collapse; border: 1px solid black;">
            <tbody>
                <tr>
                    <td style="border: 1px solid black; padding: 5px 8px; width: 25%;">B/L No</td>
                    <td style="border: 1px solid black; padding: 5px 8px;"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 5px 8px; width: 25%;">Carrier</td>
                    <td style="border: 1px solid black; padding: 5px 8px;"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 5px 8px; width: 25%;">Container No</td>
                    <td style="border: 1px solid black; padding: 5px 8px;"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 5px 8px; width: 25%;">ETD</td>
                    <td style="border: 1px solid black; padding: 5px 8px;"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 5px 8px; width: 25%;">ETA</td>
                    <td style="border: 1px solid black; padding: 5px 8px;"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 5px 8px; width: 25%;">Incoterm</td>
                    <td style="border: 1px solid black; padding: 5px 8px;"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
