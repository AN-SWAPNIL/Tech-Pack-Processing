<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Purchase Order</title>
</head>
<body style="font-family: Arial, sans-serif; font-size: 14px; color: #000000; background-color: #ffffff; margin: 40px;">
    <div style="width: 100%; max-width: 800px; margin: auto;">
        <h1 style="font-size: 24px; font-weight: bold; margin: 0 0 20px 0; padding: 0;">PURCHASE ORDER</h1>
        <div style="margin-bottom: 20px; font-size: 14px; line-height: 1.5;">
            <span style="font-weight: bold;">Buyer:</span> 
            <br>
            <span style="font-weight: bold;">PO No:</span> &mdash; <span style="font-weight: bold;">Order ID:</span> unknown
        </div>
        <table style="width: 100%; border-collapse: collapse; border: 1px solid black;">
            <tbody>
                <tr>
                    <td style="border: 1px solid black; padding: 8px 12px; width: 180px;">Product</td>
                    <td style="border: 1px solid black; padding: 8px 12px;">hoodie, knit</td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 8px 12px;">HS Code</td>
                    <td style="border: 1px solid black; padding: 8px 12px;">6102.20.00</td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 8px 12px;">Qty</td>
                    <td style="border: 1px solid black; padding: 8px 12px;">44849 pcs</td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 8px 12px;">FOB USD/pc</td>
                    <td style="border: 1px solid black; padding: 8px 12px;">10.74</td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 8px 12px;">Ex-Factory Date</td>
                    <td style="border: 1px solid black; padding: 8px 12px;"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 8px 12px;">Port of Loading</td>
                    <td style="border: 1px solid black; padding: 8px 12px;">Benapole Land Port</td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 8px 12px;">Destination</td>
                    <td style="border: 1px solid black; padding: 8px 12px;">US</td>
                </tr>
                <tr>
                    <td style="border: 1px solid black; padding: 8px 12px;">Incoterm</td>
                    <td style="border: 1px solid black; padding: 8px 12px;"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
