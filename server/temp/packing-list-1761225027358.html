<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Packing List</title>
</head>
<body style="font-family: Arial, sans-serif; font-size: 14px; margin: 40px;">

    <div style="width: 100%; max-width: 800px; margin: auto;">
        <h1 style="font-size: 24px; font-weight: bold; text-align: left; margin-bottom: 30px; padding-left: 5px;">PACKING LIST</h1>

        <div style="margin-bottom: 20px; line-height: 1.6; font-size: 16px; padding-left: 5px;">
            <p style="margin: 0; padding: 0;"><span style="font-weight: bold;">Buyer:</span> </p>
            <p style="margin: 0; padding: 0;"><span style="font-weight: bold;">PO No:</span> &mdash; <span style="font-weight: bold;">Order ID:</span> unknown</p>
        </div>

        <table style="width: 100%; border-collapse: collapse; border: 1px solid black; font-size: 16px;">
            <tbody>
                <tr style="border: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px; width: 60%;">Total Cartons</td>
                    <td style="border: 1px solid black; padding: 8px;"></td>
                </tr>
                <tr style="border: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px; width: 60%;">Total Quantity (pcs)</td>
                    <td style="border: 1px solid black; padding: 8px;">44849</td>
                </tr>
                <tr style="border: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px; width: 60%;">Gross Weight (MT)</td>
                    <td style="border: 1px solid black; padding: 8px;"></td>
                </tr>
                <tr style="border: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px; width: 60%;">Net Weight (MT)</td>
                    <td style="border: 1px solid black; padding: 8px;"></td>
                </tr>
                <tr style="border: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px; width: 60%;">Ex-Factory Date</td>
                    <td style="border: 1px solid black; padding: 8px;"></td>
                </tr>
                <tr style="border: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px; width: 60%;">Destination Port</td>
                    <td style="border: 1px solid black; padding: 8px;">Benapole Land Port</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
