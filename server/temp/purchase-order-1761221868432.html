<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Purchase Order</title>
</head>
<body style="font-family: Arial, sans-serif; font-size: 12px; margin: 40px;">

    <div style="width: 100%; max-width: 800px; margin: auto;">
        <p style="font-size: 24px; font-weight: bold; margin: 0 0 20px 0;">PURCHASE ORDER</p>
        
        <p style="font-size: 14px; margin: 0 0 5px 0;">
            <span style="font-weight: bold;">Buyer:</span> ABC Retail Corp
        </p>
        <p style="font-size: 14px; margin: 0 0 20px 0;">
            <span style="font-weight: bold;">PO No:</span> PO-2025-001 — <span style="font-weight: bold;">Order ID:</span> TEST-001
        </p>

        <table style="width: 100%; border-collapse: collapse; border: 1px solid black;">
            <tbody>
                <tr style="border: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px; width: 25%;">Product</td>
                    <td style="border: 1px solid black; padding: 8px;">T-Shirt, Cotton</td>
                </tr>
                <tr style="border: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px;">HS Code</td>
                    <td style="border: 1px solid black; padding: 8px;">6109.10.00</td>
                </tr>
                <tr style="border: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px;">Qty</td>
                    <td style="border: 1px solid black; padding: 8px;">10000 pcs</td>
                </tr>
                <tr style="border: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px;">FOB USD/pc</td>
                    <td style="border: 1px solid black; padding: 8px;">5.5</td>
                </tr>
                <tr style="border: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px;">Ex-Factory Date</td>
                    <td style="border: 1px solid black; padding: 8px;">2025-11-15</td>
                </tr>
                <tr style="border: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px;">Port of Loading</td>
                    <td style="border: 1px solid black; padding: 8px;">Chittagong</td>
                </tr>
                <tr style="border: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px;">Destination</td>
                    <td style="border: 1px solid black; padding: 8px;">New York, USA</td>
                </tr>
                <tr style="border: 1px solid black;">
                    <td style="border: 1px solid black; padding: 8px;">Incoterm</td>
                    <td style="border: 1px solid black; padding: 8px;">FOB</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
