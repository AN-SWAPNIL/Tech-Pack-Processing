<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Purchase Order</title>
</head>
<body style="font-family: Arial, sans-serif; color: #000000; margin: 0; padding: 0;">
    <div style="width: 100%; max-width: 800px; margin: 40px auto; padding: 20px;">
        <div style="font-size: 24px; font-weight: bold; margin-bottom: 20px; font-family: Arial, sans-serif;">PURCHASE ORDER</div>
        <div style="font-size: 14px; margin-bottom: 5px; font-family: Arial, sans-serif;">
            <span style="font-weight: bold;">Buyer:</span> 
        </div>
        <div style="font-size: 14px; margin-bottom: 20px; font-family: Arial, sans-serif;">
            <span style="font-weight: bold;">PO No:</span> unknown — <span style="font-weight: bold;">Order ID:</span> 
        </div>

        <table style="width: 100%; border-collapse: collapse; border: 1px solid #000000; font-size: 12px; font-family: Arial, sans-serif;">
            <tbody>
                <tr>
                    <td style="border: 1px solid #000000; padding: 8px; width: 25%;">Product</td>
                    <td style="border: 1px solid #000000; padding: 8px;">hoodie, knit</td>
                </tr>
                <tr>
                    <td style="border: 1px solid #000000; padding: 8px;">HS Code</td>
                    <td style="border: 1px solid #000000; padding: 8px;">6102.20.00</td>
                </tr>
                <tr>
                    <td style="border: 1px solid #000000; padding: 8px;">Qty</td>
                    <td style="border: 1px solid #000000; padding: 8px;">44849 pcs</td>
                </tr>
                <tr>
                    <td style="border: 1px solid #000000; padding: 8px;">FOB USD/pc</td>
                    <td style="border: 1px solid #000000; padding: 8px;">10.74</td>
                </tr>
                <tr>
                    <td style="border: 1px solid #000000; padding: 8px;">Ex-Factory Date</td>
                    <td style="border: 1px solid #000000; padding: 8px;">&nbsp;</td>
                </tr>
                <tr>
                    <td style="border: 1px solid #000000; padding: 8px;">Port of Loading</td>
                    <td style="border: 1px solid #000000; padding: 8px;">Benapole Land Port</td>
                </tr>
                <tr>
                    <td style="border: 1px solid #000000; padding: 8px;">Destination</td>
                    <td style="border: 1px solid #000000; padding: 8px;">US</td>
                </tr>
                <tr>
                    <td style="border: 1px solid #000000; padding: 8px;">Incoterm</td>
                    <td style="border: 1px solid #000000; padding: 8px;">&nbsp;</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
