<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Order</title>
</head>
<body style="font-family: Arial, sans-serif; font-size: 12px; margin: 40px;">

    <div style="width: 800px; margin: auto;">

        <div style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">PURCHASE ORDER</div>

        <div style="margin-bottom: 15px; font-size: 14px;">
            <span style="font-weight: bold;">Buyer:</span> 
        </div>
        <div style="margin-bottom: 20px; font-size: 14px;">
            <span style="font-weight: bold;">PO No:</span>  &mdash; <span style="font-weight: bold;">Order ID:</span> unknown
        </div>

        <table style="width: 100%; border-collapse: collapse; border: 1px solid black;">
            <tbody>
                <tr style="border-bottom: 1px solid black;">
                    <td style="border-right: 1px solid black; padding: 6px 8px; width: 25%;">Product</td>
                    <td style="padding: 6px 8px;">hoodie, knit</td>
                </tr>
                <tr style="border-bottom: 1px solid black;">
                    <td style="border-right: 1px solid black; padding: 6px 8px;">HS Code</td>
                    <td style="padding: 6px 8px;">6102.20.00</td>
                </tr>
                <tr style="border-bottom: 1px solid black;">
                    <td style="border-right: 1px solid black; padding: 6px 8px;">Qty</td>
                    <td style="padding: 6px 8px;">44849 pcs</td>
                </tr>
                <tr style="border-bottom: 1px solid black;">
                    <td style="border-right: 1px solid black; padding: 6px 8px;">FOB USD/pc</td>
                    <td style="padding: 6px 8px;">10.74</td>
                </tr>
                <tr style="border-bottom: 1px solid black;">
                    <td style="border-right: 1px solid black; padding: 6px 8px;">Ex-Factory Date</td>
                    <td style="padding: 6px 8px;"></td>
                </tr>
                <tr style="border-bottom: 1px solid black;">
                    <td style="border-right: 1px solid black; padding: 6px 8px;">Port of Loading</td>
                    <td style="padding: 6px 8px;">Benapole Land Port</td>
                </tr>
                <tr style="border-bottom: 1px solid black;">
                    <td style="border-right: 1px solid black; padding: 6px 8px;">Destination</td>
                    <td style="padding: 6px 8px;">US</td>
                </tr>
                <tr>
                    <td style="border-right: 1px solid black; padding: 6px 8px;">Incoterm</td>
                    <td style="padding: 6px 8px;"></td>
                </tr>
            </tbody>
        </table>

    </div>

</body>
